<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#4f46e5"/></marker>
    <marker id="a2" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#0d9488"/></marker>
  </defs>
  <rect width="860" height="440" fill="#f8fafc"/>
  <text x="40" y="46" font-size="24" font-weight="800" fill="#1e293b">一次 HTTP 请求的生命周期</text>

  <!-- client -->
  <rect x="50" y="110" width="180" height="200" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="140" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#312e81">客户端</text>
  <text x="140" y="162" text-anchor="middle" font-size="12" fill="#64748b">浏览器 / App / curl</text>

  <!-- server -->
  <rect x="630" y="110" width="180" height="200" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="720" y="140" text-anchor="middle" font-size="16" font-weight="700" fill="#115e59">服务器 (FastAPI)</text>
  <text x="720" y="162" text-anchor="middle" font-size="12" fill="#64748b">路由 → 校验 → 处理</text>

  <!-- request arrow -->
  <path d="M235 190 L625 190" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a1)" fill="none"/>
  <text x="430" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#4f46e5">请求 Request</text>
  <text x="430" y="210" text-anchor="middle" font-size="12" fill="#475569">方法 + 路径 + 头 + 体</text>
  <text x="430" y="228" text-anchor="middle" font-size="12" fill="#64748b">POST /tasks  { "title": "..." }</text>

  <!-- response arrow -->
  <path d="M625 260 L235 260" stroke="#0d9488" stroke-width="2.5" marker-end="url(#a2)" fill="none"/>
  <text x="430" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#0d9488">响应 Response</text>
  <text x="430" y="305" text-anchor="middle" font-size="12" fill="#64748b">201 Created  { "id": 1, ... }</text>

  <!-- status code legend -->
  <rect x="50" y="340" width="760" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="68" y="365" font-size="13" font-weight="700" fill="#475569">状态码会说话：</text>
  <circle cx="190" cy="361" r="6" fill="#16a34a"/><text x="202" y="366" font-size="12" fill="#334155">2xx 成功</text>
  <circle cx="300" cy="361" r="6" fill="#d97706"/><text x="312" y="366" font-size="12" fill="#334155">4xx 客户端错 (401/403/404/422)</text>
  <circle cx="560" cy="361" r="6" fill="#dc2626"/><text x="572" y="366" font-size="12" fill="#334155">5xx 服务端错 (500)</text>
  <text x="68" y="393" font-size="12" fill="#64748b">方法语义：GET 取 · POST 建 · PUT/PATCH 改 · DELETE 删 —— 别用 GET 改数据</text>
</svg>
