<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="np" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <marker id="ng" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  </defs>
  <rect width="860" height="400" fill="#f8fafc"/>
  <text x="40" y="44" font-size="23" font-weight="800" fill="#1e293b">ORM 常见坑：N+1 查询</text>
  <text x="40" y="68" font-size="13" fill="#64748b">查 1 批数据，却在循环里对每条再查一次——查询次数爆炸</text>

  <!-- bad -->
  <rect x="40" y="92" width="380" height="270" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="60" y="120" font-size="15" font-weight="700" fill="#b91c1c">✗ N+1：慢</text>
  <rect x="60" y="136" width="200" height="34" rx="8" fill="#fff" stroke="#fca5a5"/>
  <text x="160" y="158" text-anchor="middle" font-size="12" fill="#334155">查所有 task（1 次）</text>
  <g font-size="11">
    <rect x="60" y="186" width="150" height="26" rx="6" fill="#fff" stroke="#fca5a5"/><text x="135" y="203" text-anchor="middle" fill="#b91c1c">查 task1 的 tags</text>
    <rect x="60" y="218" width="150" height="26" rx="6" fill="#fff" stroke="#fca5a5"/><text x="135" y="235" text-anchor="middle" fill="#b91c1c">查 task2 的 tags</text>
    <rect x="60" y="250" width="150" height="26" rx="6" fill="#fff" stroke="#fca5a5"/><text x="135" y="267" text-anchor="middle" fill="#b91c1c">查 task3 的 tags</text>
    <text x="135" y="296" text-anchor="middle" fill="#b91c1c">… 共 N 次</text>
  </g>
  <path d="M230 199 L250 199" stroke="#dc2626" stroke-width="1.5" marker-end="url(#np)"/>
  <path d="M230 231 L250 231" stroke="#dc2626" stroke-width="1.5" marker-end="url(#np)"/>
  <rect x="270" y="186" width="120" height="90" rx="10" fill="#fee2e2" stroke="#ef4444"/>
  <text x="330" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">1 + N</text>
  <text x="330" y="248" text-anchor="middle" font-size="12" fill="#b91c1c">次查询</text>
  <text x="60" y="340" font-size="12" fill="#b91c1c">100 条数据 = 101 次查询</text>

  <!-- good -->
  <rect x="440" y="92" width="380" height="270" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="460" y="120" font-size="15" font-weight="700" fill="#15803d">✓ 预加载 / join：快</text>
  <rect x="460" y="150" width="240" height="40" rx="8" fill="#fff" stroke="#86efac"/>
  <text x="580" y="175" text-anchor="middle" font-size="12" fill="#334155">join / selectinload 一次查出</text>
  <path d="M580 192 L580 220" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ng)"/>
  <rect x="500" y="222" width="160" height="80" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="580" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">1 次查询</text>
  <text x="580" y="280" text-anchor="middle" font-size="12" fill="#15803d">task + tags 一起</text>
  <text x="460" y="340" font-size="12" fill="#15803d">100 条数据 = 1-2 次查询</text>

  <text x="40" y="390" font-size="12" fill="#64748b">排查法：开 echo=True 打印真实 SQL，看是否出现大量重复的小查询</text>
</svg>
