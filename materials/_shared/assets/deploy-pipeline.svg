<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="dp" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4f46e5"/></marker>
  </defs>
  <rect width="880" height="380" fill="#f8fafc"/>
  <text x="40" y="44" font-size="23" font-weight="800" fill="#1e293b">打包与部署流水线</text>
  <text x="40" y="68" font-size="13" fill="#64748b">锁依赖 → 构建镜像 → 运行容器（运行时注入配置）→ 上云</text>

  <!-- steps -->
  <rect x="40" y="120" width="160" height="70" rx="12" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="120" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">代码 + uv.lock</text>
  <text x="120" y="172" text-anchor="middle" font-size="11" fill="#64748b">锁定依赖版本</text>

  <rect x="250" y="120" width="160" height="70" rx="12" fill="#f0fdfa" stroke="#0d9488"/>
  <text x="330" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">docker build</text>
  <text x="330" y="172" text-anchor="middle" font-size="11" fill="#64748b">多阶段·slim·非 root</text>

  <rect x="460" y="120" width="160" height="70" rx="12" fill="#faf5ff" stroke="#9333ea"/>
  <text x="540" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#6b21a8">不可变镜像</text>
  <text x="540" y="172" text-anchor="middle" font-size="11" fill="#64748b">可移植交付单元</text>

  <rect x="670" y="120" width="170" height="70" rx="12" fill="#fffbeb" stroke="#d97706"/>
  <text x="755" y="150" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">容器运行 / 上云</text>
  <text x="755" y="172" text-anchor="middle" font-size="11" fill="#64748b">uvicorn + 健康检查</text>

  <path d="M200 155 L248 155" stroke="#4f46e5" stroke-width="2" marker-end="url(#dp)"/>
  <path d="M410 155 L458 155" stroke="#4f46e5" stroke-width="2" marker-end="url(#dp)"/>
  <path d="M620 155 L668 155" stroke="#4f46e5" stroke-width="2" marker-end="url(#dp)"/>

  <!-- config injection -->
  <rect x="460" y="240" width="380" height="80" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.3"/>
  <text x="650" y="266" text-anchor="middle" font-size="13" font-weight="700" fill="#155e75">环境变量（运行时注入）</text>
  <text x="650" y="288" text-anchor="middle" font-size="12" fill="#334155">SECRET_KEY · DATABASE_URL · DEBUG</text>
  <text x="650" y="306" text-anchor="middle" font-size="11" fill="#64748b">配置与代码分离 · 同一镜像跑不同环境</text>
  <path d="M650 240 L720 192" stroke="#0891b2" stroke-width="1.8" marker-end="url(#dp)"/>

  <!-- warning -->
  <rect x="40" y="240" width="380" height="80" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="60" y="266" font-size="13" font-weight="700" fill="#b91c1c">红线</text>
  <text x="60" y="288" font-size="12" fill="#7f1d1d">· 密钥/.env 绝不打进镜像或提交仓库</text>
  <text x="60" y="306" font-size="12" fill="#7f1d1d">· 开发配置(debug/SQLite) 不上生产</text>

  <text x="40" y="358" font-size="12" fill="#64748b">遵循 12-factor：配置外置、无状态、日志当事件流输出</text>
</svg>
