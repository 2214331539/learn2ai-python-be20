<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="nl" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#6366f1"/></marker>
  </defs>
  <rect width="840" height="400" fill="#f8fafc"/>
  <text x="40" y="44" font-size="23" font-weight="800" fill="#1e293b">变量是“标签”，不是“盒子”</text>
  <text x="40" y="68" font-size="13" fill="#64748b">赋值只是把一个名字贴到某个对象上。可变对象被多个名字共享时尤其要小心。</text>

  <!-- mutable case -->
  <rect x="40" y="92" width="380" height="290" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.3"/>
  <text x="60" y="120" font-size="15" font-weight="700" fill="#b91c1c">可变对象（list）：共享同一个</text>
  <text x="60" y="148" font-size="13" font-family="Consolas,monospace" fill="#334155">a = [1, 2, 3]</text>
  <text x="60" y="170" font-size="13" font-family="Consolas,monospace" fill="#334155">b = a        # 不是复制！</text>
  <text x="60" y="192" font-size="13" font-family="Consolas,monospace" fill="#334155">b.append(4)</text>

  <rect x="70" y="250" width="50" height="30" rx="6" fill="#fff" stroke="#6366f1"/><text x="95" y="270" text-anchor="middle" font-size="13" fill="#4338ca">a</text>
  <rect x="70" y="300" width="50" height="30" rx="6" fill="#fff" stroke="#6366f1"/><text x="95" y="320" text-anchor="middle" font-size="13" fill="#4338ca">b</text>
  <rect x="230" y="270" width="160" height="42" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="310" y="296" text-anchor="middle" font-size="13" fill="#3730a3">[1, 2, 3, 4]</text>
  <path d="M120 265 L226 285" stroke="#6366f1" stroke-width="1.6" marker-end="url(#nl)"/>
  <path d="M120 315 L226 300" stroke="#6366f1" stroke-width="1.6" marker-end="url(#nl)"/>
  <text x="60" y="360" font-size="12" fill="#b91c1c">改 b 也改了 a —— 它们指向同一个列表</text>

  <!-- immutable case -->
  <rect x="440" y="92" width="360" height="290" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
  <text x="460" y="120" font-size="15" font-weight="700" fill="#15803d">不可变对象（int）：各自独立</text>
  <text x="460" y="148" font-size="13" font-family="Consolas,monospace" fill="#334155">x = 1</text>
  <text x="460" y="170" font-size="13" font-family="Consolas,monospace" fill="#334155">y = x</text>
  <text x="460" y="192" font-size="13" font-family="Consolas,monospace" fill="#334155">y += 1      # 产生新对象</text>

  <rect x="470" y="250" width="50" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="495" y="270" text-anchor="middle" font-size="13" fill="#15803d">x</text>
  <rect x="470" y="300" width="50" height="30" rx="6" fill="#fff" stroke="#16a34a"/><text x="495" y="320" text-anchor="middle" font-size="13" fill="#15803d">y</text>
  <rect x="640" y="248" width="60" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="670" y="270" text-anchor="middle" font-size="13" fill="#15803d">1</text>
  <rect x="640" y="300" width="60" height="34" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="670" y="322" text-anchor="middle" font-size="13" fill="#15803d">2</text>
  <path d="M520 265 L636 265" stroke="#16a34a" stroke-width="1.6"/>
  <path d="M520 315 L636 317" stroke="#16a34a" stroke-width="1.6"/>
  <text x="460" y="360" font-size="12" fill="#15803d">改 y 不影响 x —— int 不可变，赋新值即换对象</text>
</svg>
