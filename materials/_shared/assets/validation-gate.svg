<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="vg" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0d9488"/></marker>
    <marker id="vr" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
  </defs>
  <rect width="860" height="380" fill="#f8fafc"/>
  <text x="40" y="44" font-size="23" font-weight="800" fill="#1e293b">Pydantic 是进出系统的“校验门”</text>
  <text x="40" y="68" font-size="13" fill="#64748b">永远不信任外部输入：进来先校验，出去过滤敏感字段</text>

  <!-- client in -->
  <rect x="40" y="150" width="140" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="110" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">外部输入</text>
  <text x="110" y="196" text-anchor="middle" font-size="11" fill="#64748b">客户端 JSON</text>

  <!-- gate -->
  <rect x="240" y="130" width="160" height="100" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.6"/>
  <text x="320" y="162" text-anchor="middle" font-size="14" font-weight="700" fill="#115e59">TaskCreate</text>
  <text x="320" y="184" text-anchor="middle" font-size="11" fill="#64748b">必填·长度·范围</text>
  <text x="320" y="202" text-anchor="middle" font-size="11" fill="#64748b">枚举·类型转换</text>
  <path d="M180 180 L238 180" stroke="#0d9488" stroke-width="2" marker-end="url(#vg)"/>

  <!-- valid path -->
  <rect x="470" y="110" width="160" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="550" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">合法 → 业务逻辑</text>
  <text x="550" y="152" text-anchor="middle" font-size="11" fill="#64748b">数据已可信</text>
  <path d="M400 160 L468 138" stroke="#16a34a" stroke-width="2" marker-end="url(#vg)"/>

  <!-- invalid path -->
  <rect x="470" y="196" width="160" height="56" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="550" y="218" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">非法 → 422</text>
  <text x="550" y="238" text-anchor="middle" font-size="11" fill="#64748b">自动返回清晰错误</text>
  <path d="M400 200 L468 222" stroke="#dc2626" stroke-width="2" marker-end="url(#vr)"/>

  <!-- output -->
  <rect x="690" y="110" width="130" height="56" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="755" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#6b21a8">TaskOut</text>
  <text x="755" y="152" text-anchor="middle" font-size="11" fill="#64748b">过滤敏感字段</text>
  <path d="M630 138 L688 138" stroke="#9333ea" stroke-width="2" marker-end="url(#vg)"/>

  <rect x="40" y="300" width="780" height="50" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="58" y="322" font-size="13" fill="#9a3412">关键：输入模型(Create) 与 输出模型(Out) 分开。输出模型绝不含 password_hash 等内部字段，</text>
  <text x="58" y="340" font-size="13" fill="#9a3412">配合 response_model 自动过滤——别把数据库模型直接当接口返回。</text>
</svg>
