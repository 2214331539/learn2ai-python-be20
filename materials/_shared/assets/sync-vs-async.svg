<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="860" height="420" fill="#f8fafc"/>
  <text x="40" y="44" font-size="24" font-weight="800" fill="#1e293b">同步 vs 异步（I/O 密集场景）</text>
  <text x="40" y="68" font-size="13" fill="#64748b">三个都需要“等待”的任务（如等数据库/网络）。方块=干活，斜纹=干等。</text>

  <!-- sync -->
  <text x="40" y="118" font-size="15" font-weight="700" fill="#b91c1c">同步：排队，一个等完才轮下一个</text>
  <g>
    <rect x="60" y="130" width="40" height="26" fill="#4f46e5"/><rect x="100" y="130" width="90" height="26" fill="#fecaca"/>
    <rect x="190" y="130" width="40" height="26" fill="#4f46e5"/><rect x="230" y="130" width="90" height="26" fill="#fecaca"/>
    <rect x="320" y="130" width="40" height="26" fill="#4f46e5"/><rect x="360" y="130" width="90" height="26" fill="#fecaca"/>
    <rect x="450" y="130" width="40" height="26" fill="#4f46e5"/>
    <text x="470" y="148" font-size="11" fill="#fff" text-anchor="middle">返</text>
  </g>
  <line x1="60" y1="170" x2="760" y2="170" stroke="#cbd5e1"/>
  <path d="M60 170 L760 170" stroke="#94a3b8" stroke-width="1"/>
  <text x="500" y="148" font-size="13" fill="#b91c1c">总耗时 ≈ 三段之和（很慢）→</text>

  <!-- async -->
  <text x="40" y="235" font-size="15" font-weight="700" fill="#047857">异步：等待时切去处理别的，重叠起来</text>
  <g>
    <rect x="60" y="247" width="40" height="26" fill="#0d9488"/>
    <rect x="100" y="247" width="40" height="26" fill="#0d9488"/>
    <rect x="140" y="247" width="40" height="26" fill="#0d9488"/>
    <!-- overlapping waits -->
    <rect x="100" y="280" width="200" height="16" fill="#99f6e4"/>
    <rect x="140" y="300" width="200" height="16" fill="#99f6e4"/>
    <rect x="180" y="320" width="200" height="16" fill="#99f6e4"/>
    <rect x="300" y="247" width="40" height="26" fill="#0d9488"/>
    <text x="320" y="265" font-size="11" fill="#fff" text-anchor="middle">返</text>
  </g>
  <text x="360" y="265" font-size="13" fill="#047857">总耗时 ≈ 最慢的一段（快很多）✓</text>

  <!-- caveat -->
  <rect x="40" y="356" width="780" height="44" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="58" y="383" font-size="13" fill="#9a3412">⚠ 只对 I/O 密集有效。CPU 密集（纯计算）受 GIL 限制，异步帮不上忙；且 async 里混入阻塞调用会卡死整个事件循环。</text>
</svg>
