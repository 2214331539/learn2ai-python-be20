<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="tt" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0369a1"/></marker>
  </defs>
  <rect width="860" height="400" fill="#f8fafc"/>
  <text x="40" y="44" font-size="23" font-weight="800" fill="#1e293b">测试金字塔 + 识破“假通过”</text>
  <text x="40" y="68" font-size="13" fill="#64748b">多写快而稳的单元测试；更要确认测试“真的在测东西”</text>

  <!-- pyramid -->
  <polygon points="200,100 280,100 300,150 180,150" fill="#fca5a5" stroke="#ef4444"/>
  <text x="240" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">端到端 少</text>
  <polygon points="180,152 300,152 330,210 150,210" fill="#fdba74" stroke="#d97706"/>
  <text x="240" y="186" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">集成测试</text>
  <polygon points="150,212 330,212 365,290 115,290" fill="#86efac" stroke="#16a34a"/>
  <text x="240" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">单元测试 多·快·稳</text>
  <text x="130" y="320" font-size="12" fill="#64748b">越往下越多、越快、越便宜</text>

  <!-- fake pass detection -->
  <rect x="430" y="92" width="400" height="200" rx="14" fill="#fff" stroke="#e2e8f0"/>
  <text x="450" y="120" font-size="15" font-weight="700" fill="#0369a1">如何识破 AI 的“假通过”测试</text>

  <rect x="450" y="134" width="360" height="40" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="630" y="152" text-anchor="middle" font-size="12" fill="#b91c1c">宽松断言：assert resp is not None</text>
  <text x="630" y="168" text-anchor="middle" font-size="11" fill="#64748b">代码对错都能过 = 等于没测</text>

  <rect x="450" y="184" width="360" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="630" y="202" text-anchor="middle" font-size="12" fill="#15803d">严格断言：status==201 且 body 内容正确</text>
  <text x="630" y="218" text-anchor="middle" font-size="11" fill="#64748b">覆盖错误路径：422 / 401 / 403 / 404</text>

  <rect x="450" y="234" width="360" height="44" rx="8" fill="#eff6ff" stroke="#0369a1"/>
  <text x="630" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">终极检验：故意埋一个 bug</text>
  <text x="630" y="270" text-anchor="middle" font-size="11" fill="#64748b">测试该变红——抓不到就是无效测试</text>

  <text x="40" y="360" font-size="12" fill="#64748b">配套工具：pytest（fixture 隔离）· ruff（lint/格式）· mypy（类型）——别用 ignore 掩盖报错</text>
  <text x="40" y="382" font-size="12" fill="#92400e">覆盖率是参考不是目标：100% 覆盖也可能全是无效断言</text>
</svg>
