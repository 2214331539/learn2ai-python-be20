<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <rect width="820" height="380" fill="#f8fafc"/>
  <text x="40" y="44" font-size="23" font-weight="800" fill="#1e293b">为什么每个项目要独立的虚拟环境</text>
  <text x="40" y="68" font-size="13" fill="#64748b">venv 把各项目的依赖隔离开，避免版本互相打架</text>

  <!-- system python -->
  <rect x="320" y="92" width="180" height="48" rx="10" fill="#e2e8f0" stroke="#475569"/>
  <text x="410" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">系统 Python 3.11</text>
  <text x="410" y="132" text-anchor="middle" font-size="11" fill="#64748b">解释器（共享）</text>

  <!-- project A -->
  <rect x="60" y="190" width="320" height="150" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="80" y="216" font-size="15" font-weight="700" fill="#312e81">项目 A　.venv</text>
  <rect x="80" y="230" width="130" height="34" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="145" y="252" text-anchor="middle" font-size="12" fill="#3730a3">fastapi 0.110</text>
  <rect x="80" y="274" width="130" height="34" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="145" y="296" text-anchor="middle" font-size="12" fill="#3730a3">pydantic 2.x</text>
  <rect x="226" y="230" width="134" height="78" rx="8" fill="#fff" stroke="#c7d2fe"/>
  <text x="293" y="266" text-anchor="middle" font-size="12" fill="#64748b">自己的</text>
  <text x="293" y="284" text-anchor="middle" font-size="12" fill="#64748b">依赖集合</text>

  <!-- project B -->
  <rect x="440" y="190" width="320" height="150" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="460" y="216" font-size="15" font-weight="700" fill="#115e59">项目 B　.venv</text>
  <rect x="460" y="230" width="130" height="34" rx="8" fill="#fff" stroke="#99f6e4"/>
  <text x="525" y="252" text-anchor="middle" font-size="12" fill="#115e59">flask 2.0</text>
  <rect x="460" y="274" width="130" height="34" rx="8" fill="#fff" stroke="#99f6e4"/>
  <text x="525" y="296" text-anchor="middle" font-size="12" fill="#115e59">pydantic 1.x</text>
  <rect x="606" y="230" width="134" height="78" rx="8" fill="#fff" stroke="#99f6e4"/>
  <text x="673" y="266" text-anchor="middle" font-size="12" fill="#64748b">互不干扰</text>
  <text x="673" y="284" text-anchor="middle" font-size="12" fill="#64748b">的依赖</text>

  <line x1="360" y1="140" x2="200" y2="188" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="460" y1="140" x2="600" y2="188" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="410" y="370" text-anchor="middle" font-size="12" fill="#b91c1c">两个项目要的 pydantic 版本不同——没有 venv 就会冲突</text>
</svg>
