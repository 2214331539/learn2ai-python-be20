<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="cl" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="820" height="440" fill="#f8fafc"/>
  <text x="40" y="44" font-size="23" font-weight="800" fill="#1e293b">“选库”决策流程</text>
  <text x="40" y="68" font-size="13" fill="#64748b">遇到任务先归类，再决定用标准库还是上第三方——每个依赖都是成本</text>

  <!-- task -->
  <rect x="320" y="92" width="180" height="46" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="410" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">① 把任务归类</text>

  <!-- decision -->
  <path d="M410 150 L500 196 L410 242 L320 196 Z" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="410" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">标准库</text>
  <text x="410" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">能解决吗？</text>
  <path d="M410 138 L410 148" stroke="#64748b" stroke-width="1.6" marker-end="url(#cl)"/>

  <!-- yes -->
  <rect x="120" y="172" width="170" height="48" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="205" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">用标准库 ✓</text>
  <text x="205" y="212" text-anchor="middle" font-size="11" fill="#64748b">pathlib / json / logging…</text>
  <path d="M320 196 L292 196" stroke="#64748b" stroke-width="1.6" marker-end="url(#cl)"/>
  <text x="300" y="186" font-size="11" fill="#15803d">是</text>

  <!-- no -> candidates -->
  <rect x="530" y="172" width="250" height="48" rx="10" fill="#faf5ff" stroke="#9333ea"/>
  <text x="655" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#6b21a8">② 在 PyPI 找 2-3 个候选</text>
  <text x="655" y="212" text-anchor="middle" font-size="11" fill="#64748b">让 AI 推荐并对比</text>
  <path d="M500 196 L528 196" stroke="#64748b" stroke-width="1.6" marker-end="url(#cl)"/>
  <text x="510" y="186" font-size="11" fill="#b91c1c">否</text>

  <!-- evaluate -->
  <rect x="490" y="256" width="290" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text x="510" y="280" font-size="13" font-weight="700" fill="#475569">③ 按标准评估：</text>
  <text x="510" y="302" font-size="12" fill="#334155">· 维护是否活跃（最近有发布）</text>
  <text x="510" y="322" font-size="12" fill="#334155">· 文档是否清晰 · 社区规模</text>
  <text x="510" y="342" font-size="12" fill="#334155">· 依赖是否沉重 · 是否过度设计</text>
  <path d="M655 220 L655 254" stroke="#64748b" stroke-width="1.6" marker-end="url(#cl)"/>

  <!-- pick -->
  <rect x="120" y="290" width="300" height="48" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="270" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#312e81">④ 选定并核实其真实存在</text>
  <text x="270" y="330" text-anchor="middle" font-size="11" fill="#b91c1c">警惕 AI 编造/推荐已停更的库</text>
  <path d="M490 320 L422 318" stroke="#64748b" stroke-width="1.6" marker-end="url(#cl)"/>

  <text x="40" y="420" font-size="12" fill="#64748b">配套：后端生态“选库地图” ecosystem-map.md</text>
</svg>
